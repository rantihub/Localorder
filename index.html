<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Localorder - Feedlink Asaba Hub</title>
    <style>
        :root {
            --primary: #0f5132;
            --primary-light: #198754;
            --primary-soft: #e8f5e9;
            --accent: #ffc107;
            --accent-dark: #d39e00;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border: #e0e0e0;
            --danger: #dc3545;
            --info: #0dcaf0;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            padding-bottom: 190px;
        }

        /* Fixed Sticky Header */
        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #ffffff;
            padding: 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        header p {
            margin: 4px 0 0 0;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px;
        }

        /* Top Controls: Customer Card & Search */
        .top-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        .form-control:focus {
            border-color: var(--primary-light);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.15);
        }

        /* Product Categories */
        .category-block {
            background: var(--card-bg);
            border-radius: var(--radius);
            margin-bottom: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .category-header {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 12px 16px;
            font-weight: 700;
            font-size: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-item {
            display: grid;
            grid-template-columns: 1fr 110px auto;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }

        .product-item:last-child {
            border-bottom: none;
        }

        .product-item.active-item {
            background-color: #f4fbf7;
        }

        .product-details {
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--text-main);
        }

        .product-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .product-price-tag {
            font-weight: 700;
            color: var(--primary);
        }

        /* Stepper input controls */
        .qty-stepper {
            display: flex;
            align-items: center;
            background: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .qty-stepper button {
            width: 32px;
            height: 36px;
            border: none;
            background: #e4e4e4;
            color: #333;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            user-select: none;
        }

        .qty-stepper button:active {
            background: #ccc;
        }

        .qty-stepper input {
            width: 46px;
            height: 36px;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            -moz-appearance: textfield;
        }

        .qty-stepper input::-webkit-outer-spin-button,
        .qty-stepper input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .item-sales-value {
            text-align: right;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary);
            min-width: 80px;
        }

        /* Display Summary Area */
        .summary-panel {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            margin-top: 15px;
            display: none;
            border-left: 5px solid var(--accent);
            box-shadow: var(--shadow);
        }

        .summary-panel h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.1rem;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            font-size: 0.88rem;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 0;
        }

        /* Floating Bottom Action Bar */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
            padding: 12px 16px;
            z-index: 1001;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .total-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .total-weight-text {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            margin-left: 6px;
        }

        .total-amount-text {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-view { background: var(--accent); color: #000; }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-reset { background: #fff0f0; color: var(--danger); border: 1px solid #fecaca; margin-top: 10px; }
        .btn-month { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; margin-top: 10px; }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<header>
    <h1>Localorder</h1>
    <p>Feedlink Asaba Hub Price Calculator</p>
</header>

<div class="container">
    <div class="top-card">
        <div class="form-group">
            <label for="cust-name">Customer Name</label>
            <input type="text" id="cust-name" class="form-control" placeholder="Enter customer's name..." oninput="saveCustomerName()">
        </div>
        <div class="form-group" style="margin-top: 10px;">
            <label for="search-input">Quick Search Product</label>
            <input type="text" id="search-input" class="form-control" placeholder="Search by name (e.g., 0.5mm, Layer, Broiler)..." oninput="filterProducts()">
        </div>
    </div>
</div>

<div class="container" id="main-list">
    <!-- UI generated via JavaScript -->
</div>

<div class="container">
    <div id="summary-display" class="summary-panel">
        <h3 id="sum-type">Order Details</h3>
        <div id="summary-text"></div>
    </div>
    <button class="btn btn-month" onclick="showMonthlySummary()">📅 View Monthly History</button>
    <button class="btn btn-reset" onclick="resetOrder()">🗑️ Clear Current Order</button>
</div>

<div class="footer-nav">
    <div class="footer-content">
        <div class="total-row">
            <div>
                <span class="total-label">Total Weight:</span>
                <span class="total-weight-text" id="total-weight">0 kg</span>
            </div>
            <div class="total-amount-text" id="total-naira">₦0</div>
        </div>
        <div class="btn-grid">
            <button class="btn btn-view" onclick="showSummary()">📋 Show Summary</button>
            <button class="btn btn-wa" onclick="sendWhatsApp()">💬 WhatsApp Order</button>
        </div>
    </div>
</div>

<script>
    const productData = [
        { 
            cat: "SKRETTING CRUMBLES", 
            items: [
                { name: "Perla Larva", price: 14000, w: 1 },
                { name: "0.5mm", price: 57450, w: 5 },
                { name: "0.7mm", price: 57450, w: 5 },
                { name: "1.1mm", price: 39950, w: 5 },
                { name: "1.8mm", price: 24700, w: 5 }
            ]
        },
        { 
            cat: "SKRETTING SUPERIOR (15kg)", 
            items: [
                { name: "2ms", price: 32700, w: 15 },
                { name: "3ms", price: 27300, w: 15 },
                { name: "4.5ms", price: 25500, w: 15 },
                { name: "6ms", price: 25500, w: 15 },
                { name: "8ms", price: 25500, w: 15 }
            ]
        },
        { 
            cat: "SKRETTING ESSENTIAL (15kg)", 
            items: [
                { name: "3mes", price: 26250, w: 15 },
                { name: "4.5mes", price: 24150, w: 15 },
                { name: "6mes", price: 22650, w: 15 },
                { name: "8mes", price: 21150, w: 15 }
            ]
        },
        { 
            cat: "ADDITIVES", 
            items: [
                { name: "Aquacare", price: 48700, w: 1 },
                { name: "Selko PH (25ltrs)", price: 101500, w: 25 }
            ]
        },
        { 
            cat: "HENDRIX BROILER PRO PELLET (25kg)", 
            items: [
                { name: "Prestarter", price: 25950, w: 25 },
                { name: "B/starter", price: 24950, w: 25 },
                { name: "B/Finisher", price: 24450, w: 25 }
            ]
        },
        { 
            cat: "HENDRIX BROILER ESSENTIAL (25kg)", 
            items: [
                { name: "B/Starter Ess", price: 22700, w: 25 },
                { name: "B/Grower Ess", price: 20200, w: 25 },
                { name: "B/Finisher Ess", price: 20700, w: 25 }
            ]
        },
        { 
            cat: "CONCENTRATE (50kg)", 
            items: [
                { name: "L/Prod. cct 5%", price: 113700, w: 50 },
                { name: "L/rearer cct 5%", price: 93200, w: 50 },
                { name: "B/starter cct 5%", price: 140200, w: 50 },
                { name: "B/Finisher cct 5%", price: 135200, w: 50 }
            ]
        },
        { 
            cat: "MASH (25kg)", 
            items: [
                { name: "L/mash", price: 13500, w: 25 },
                { name: "G/mash", price: 13400, w: 25 },
                { name: "C/mash", price: 15700, w: 25 }
            ]
        }
    ];

    let currentOrder = JSON.parse(localStorage.getItem('localorder_current')) || {};

    function init() {
        document.getElementById('cust-name').value = localStorage.getItem('localorder_customer') || "";
        renderList();
        updateTotals();
    }

    function renderList() {
        const main = document.getElementById('main-list');
        main.innerHTML = '';

        productData.forEach((group, gIdx) => {
            let section = document.createElement('div');
            section.className = 'category-block';
            section.id = `cat-block-${gIdx}`;

            let html = `<div class="category-header"><span>${group.cat}</span></div>`;
            
            group.items.forEach(item => {
                const qty = currentOrder[item.name] || 0;
                const activeClass = qty > 0 ? 'active-item' : '';
                const formatPrice = item.price.toLocaleString();
                const lineTotal = (qty * item.price).toLocaleString();

                html += `
                    <div class="product-item ${activeClass}" id="row-${escapeId(item.name)}" data-name="${item.name.toLowerCase()}">
                        <div class="product-details">
                            <span class="product-title">${item.name}</span>
                            <span class="product-sub"><span class="product-price-tag">₦${formatPrice}</span> • ${item.w}kg</span>
                        </div>
                        <div class="qty-stepper">
                            <button onclick="adjustQty('${escapeJsStr(item.name)}', -1)">-</button>
                            <input type="number" min="0" value="${qty}" id="input-${escapeId(item.name)}" oninput="updateItem('${escapeJsStr(item.name)}', this.value)">
                            <button onclick="adjustQty('${escapeJsStr(item.name)}', 1)">+</button>
                        </div>
                        <div class="item-sales-value" id="val-${escapeId(item.name)}">₦${lineTotal}</div>
                    </div>`;
            });

            section.innerHTML = html;
            main.appendChild(section);
        });
    }

    function escapeId(str) {
        return str.replace(/[^a-zA-Z0-9]/g, '_');
    }

    function escapeJsStr(str) {
        return str.replace(/'/g, "\\'");
    }

    function adjustQty(name, delta) {
        const currentQty = currentOrder[name] || 0;
        const newQty = Math.max(0, currentQty + delta);
        const inputEl = document.getElementById(`input-${escapeId(name)}`);
        if (inputEl) {
            inputEl.value = newQty;
        }
        updateItem(name, newQty);
    }

    function updateItem(name, qty) {
        const parsedQty = parseInt(qty) || 0;
        if (parsedQty > 0) {
            currentOrder[name] = parsedQty;
        } else {
            delete currentOrder[name];
        }

        localStorage.setItem('localorder_current', JSON.stringify(currentOrder));

        const product = productData.flatMap(g => g.items).find(i => i.name === name);
        const rowEl = document.getElementById(`row-${escapeId(name)}`);
        const valEl = document.getElementById(`val-${escapeId(name)}`);

        if (valEl) {
            valEl.innerText = `₦${((currentOrder[name] || 0) * product.price).toLocaleString()}`;
        }

        if (rowEl) {
            if (parsedQty > 0) {
                rowEl.classList.add('active-item');
            } else {
                rowEl.classList.remove('active-item');
            }
        }

        updateTotals();
    }

    function updateTotals() {
        let totalCash = 0;
        let totalWeight = 0;

        productData.flatMap(g => g.items).forEach(item => {
            const qty = currentOrder[item.name] || 0;
            totalCash += qty * item.price;
            totalWeight += qty * item.w;
        });

        document.getElementById('total-naira').innerText = `₦${totalCash.toLocaleString()}`;
        document.getElementById('total-weight').innerText = `${totalWeight.toLocaleString()} kg`;
    }

    function saveCustomerName() {
        localStorage.setItem('localorder_customer', document.getElementById('cust-name').value);
    }

    function filterProducts() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        productData.forEach((group, gIdx) => {
            let hasVisibleItem = false;
            group.items.forEach(item => {
                const rowEl = document.getElementById(`row-${escapeId(item.name)}`);
                if (rowEl) {
                    if (item.name.toLowerCase().includes(query)) {
                        rowEl.classList.remove('hidden');
                        hasVisibleItem = true;
                    } else {
                        rowEl.classList.add('hidden');
                    }
                }
            });

            const catBlock = document.getElementById(`cat-block-${gIdx}`);
            if (catBlock) {
                if (hasVisibleItem) {
                    catBlock.classList.remove('hidden');
                } else {
                    catBlock.classList.add('hidden');
                }
            }
        });
    }

    function getSummary() {
        const cName = document.getElementById('cust-name').value.trim() || "Valued Customer";
        let text = `*ORDER DETAILS*\n`;
        text += `Customer: ${cName}\n`;
        text += `Date: ${new Date().toLocaleDateString()}\n`;
        text += `--------------------\n`;

        let totalCash = 0;
        let totalWeight = 0;
        let totalQty = 0;

        productData.flatMap(g => g.items).forEach(item => {
            const qty = currentOrder[item.name] || 0;
            if (qty > 0) {
                const lineVal = qty * item.price;
                const lineW = qty * item.w;
                text += `• ${item.name}: ${qty} qty × ₦${item.price.toLocaleString()} = ₦${lineVal.toLocaleString()} (${lineW}kg)\n`;
                totalCash += lineVal;
                totalWeight += lineW;
                totalQty += qty;
            }
        });

        if (totalQty === 0) return "No items in current order.";

        text += `--------------------\n`;
        text += `*Total Qty:* ${totalQty}\n`;
        text += `*Total Weight:* ${totalWeight.toLocaleString()}kg\n`;
        text += `*GRAND TOTAL: ₦${totalCash.toLocaleString()}*`;
        return text;
    }

    function showSummary() {
        const display = document.getElementById('summary-display');
        document.getElementById('sum-type').innerText = "Order Details";
        document.getElementById('summary-text').innerHTML = `<pre>${getSummary()}</pre>`;
        display.style.display = 'block';
        display.scrollIntoView({ behavior: 'smooth' });
    }

    function sendWhatsApp() {
        saveToMonthly();
        const text = encodeURIComponent(getSummary());
        window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    function saveToMonthly() {
        let monthly = JSON.parse(localStorage.getItem('localorder_monthly')) || { qty: 0, weight: 0, value: 0 };
        productData.flatMap(g => g.items).forEach(item => {
            const qty = currentOrder[item.name] || 0;
            monthly.qty += qty;
            monthly.weight += (qty * item.w);
            monthly.value += (qty * item.price);
        });
        localStorage.setItem('localorder_monthly', JSON.stringify(monthly));
    }

    function showMonthlySummary() {
        let monthly = JSON.parse(localStorage.getItem('localorder_monthly')) || { qty: 0, weight: 0, value: 0 };
        const display = document.getElementById('summary-display');
        document.getElementById('sum-type').innerText = "Monthly Cumulative Summary";
        document.getElementById('summary-text').innerHTML = `
            <pre>
Total Qty for Month: ${monthly.qty}
Total Weight for Month: ${monthly.weight.toLocaleString()} kg
Total Value for Month: ₦${monthly.value.toLocaleString()}
            </pre>`;
        display.style.display = 'block';
        display.scrollIntoView({ behavior: 'smooth' });
    }

    function resetOrder() {
        if(confirm("Are you sure you want to clear current order quantities and customer name?")) {
            currentOrder = {};
            localStorage.removeItem('localorder_current');
            localStorage.removeItem('localorder_customer');
            document.getElementById('cust-name').value = '';
            document.getElementById('summary-display').style.display = 'none';
            renderList();
            updateTotals();
        }
    }

    window.onload = init;
</script>
</body>
</html>
